name = "matrix_mortality"
version = "0.1.0"
defaultTargets = ["MatrixMortality", "Frankl"]
leanOptions = {warningAsError = true, autoImplicit = false, pp.unicode.fun = true, linter.docPrime = true, linter.hashCommand = true, linter.oldObtain = true, linter.style.refine = true, linter.style.cdot = true, linter.style.dollarSyntax = true, linter.style.lambdaSyntax = true, linter.style.longFile = 1500, linter.style.longLine = true, linter.style.missingEnd = true, linter.style.setOption = true}

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "MatrixMortality"

[[lean_lib]]
name = "Frankl"
